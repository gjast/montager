# Выпуск новой версии для Windows. Запускается сам при каждом изменении программы в ветке main:
# собирает Montager.exe и наборы, проверяет их на настоящей Windows и публикует выпуск.
# Запускалка у пользователей при следующем старте увидит его и обновится.
name: release

on:
  push:
    branches: [main]
    paths:
      - montage.py
      - download.py
      - run.py
      - requirements.txt
      - launcher/**
      - tools/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Version
        shell: bash
        run: |
          echo "VERSION=$(date -u +%Y.%m.%d).${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "TAG=v${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --upgrade pip pyinstaller
          python tools/build_release.py --out dist --version "$VERSION" --base-url http://127.0.0.1:8765

      - name: Smoke test on Windows
        shell: bash
        run: python tools/smoke_test.py dist

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/build_release.py --out dist --version "$VERSION" --manifest-only \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          # черновик → загрузка файлов → публикация: выпуск становится «последним» уже целым
          gh release create "$TAG" --draft --title "$VERSION" \
            --notes "Montager.exe — программа для Windows. Скачай и запусти; дальше она обновляется сама." \
            dist/Montager.exe dist/app.zip dist/runtime.zip dist/ffmpeg.zip dist/manifest.json
          gh release edit "$TAG" --draft=false --latest
